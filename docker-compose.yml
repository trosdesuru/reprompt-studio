services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/storage
    environment:
      - SENTRY_DSN=https://76fc0033b8bdfc06d1d99b4aba86a9d6@o4511303407632384.ingest.de.sentry.io/4511303412023376
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - STORAGE_PATH=/storage
    depends_on:
      - redis
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./storage:/storage
    environment:
      - SENTRY_DSN=https://76fc0033b8bdfc06d1d99b4aba86a9d6@o4511303407632384.ingest.de.sentry.io/4511303412023376
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - STORAGE_PATH=/storage
    depends_on:
      - redis
    command: python worker.py

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_SENTRY_DSN=https://2b38b71f741cb421ed60073c9c3a7f80@o4511303407632384.ingest.de.sentry.io/4511303429980240
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
