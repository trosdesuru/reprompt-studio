# 1. Identificadores Reales
sonar.projectKey=trosdesuru_scraper-galerias
sonar.organization=trosdesuru 

# 2. Qué escanear y qué ignorar (Directriz de Saneamiento)
sonar.sources=backend/app,frontend/src
sonar.exclusions=**/node_modules/**, **/.next/**, **/venv/**, **/tests/**, **/*.spec.*, **/*.test.*

# 3. Configuraciones de Entorno
sonar.python.version=3.11
sonar.javascript.node.maxspace=4096

# 4. Rutas de Reportes de Cobertura (Para que no marque 0%)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml