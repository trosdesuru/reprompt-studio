[tool.ruff]
select = ["E", "F", "I", "B"] # Errores, Fallos, Importaciones, Bugbear
ignore = []
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
relative_files = true
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"