name: 🛡️ Backend Security & Core Tests

# 1. ¿Cuándo se ejecuta?
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-backend:
    name: 🧪 Run Pytest Suite
    runs-on: ubuntu-latest

    # 2. Infraestructura efímera: Levantamos un Redis solo para el test
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 3. Variables de entorno falsas (Mocking del entorno)
    env:
      DATABASE_URL: "sqlite:///:memory:"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      SECRET_KEY: "super_secret_test_key_for_ci_only"
      ENVIRONMENT: "test"
      R2_ENDPOINT_URL: "https://fake.r2.cloudflarestorage.com"
      R2_ACCESS_KEY: "fake_key"
      R2_SECRET_KEY: "fake_secret"
      R2_BUCKET_NAME: "test-bucket"
      R2_PUBLIC_URL: "https://r2.reprompt.studio"
      GOOGLE_CLIENT_ID: "fake_google_id"
      GOOGLE_CLIENT_SECRET: "fake_google_secret"
      DISCORD_CLIENT_ID: "fake_discord_id"
      DISCORD_CLIENT_SECRET: "fake_discord_secret"

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🐍 Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Acelera las ejecuciones futuras guardando los paquetes en caché

      - name: 📦 Instalar Dependencias
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Aseguramos que las herramientas de test están instaladas
          pip install pytest httpx pytest-asyncio

      - name: 🚀 Ejecutar Batería de Tests (Los 17 Escudos)
        working-directory: ./backend
        run: |
          PYTHONPATH=. \
          DATABASE_URL="sqlite:///:memory:" \
          REDIS_URL="redis://127.0.0.1:6379/0" \
          ENVIRONMENT="test" \
          python -m pytest -v
