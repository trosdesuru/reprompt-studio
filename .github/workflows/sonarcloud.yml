name: 🛡️ Build, Test & SonarQube

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-and-scan:
    name: 🧪 Test & Scan
    runs-on: ubuntu-latest # ubuntu es 10x más rápido y barato que macos en Actions

    # 1. Levantamos Redis para que los tests puedan ejecutarse
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Vital para que SonarQube sepa qué líneas son nuevas

      - name: 🐍 Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov httpx pytest-asyncio
          pip install -r backend/requirements.txt

      - name: 🚀 Ejecutar Tests y Generar Cobertura XML
        env:
          DATABASE_URL: "sqlite:///./test.db"
          REDIS_URL: "redis://127.0.0.1:6379/0"
          SECRET_KEY: "super_secret_test_key_for_ci_only"
          ENVIRONMENT: "test"
          R2_ENDPOINT_URL: "https://fake.r2.cloudflarestorage.com"
          R2_ACCESS_KEY: "fake_key"
          R2_SECRET_KEY: "fake_secret"
          R2_BUCKET_NAME: "test-bucket"
          R2_PUBLIC_URL: "https://r2.reprompt.studio"
          GOOGLE_CLIENT_ID: "fake_google_id"
          GOOGLE_CLIENT_SECRET: "fake_google_secret"
        # Ejecutamos desde la raíz para que el XML tenga rutas absolutas correctas
        run: PYTHONPATH=backend pytest backend/tests --cov=backend/app --cov-report=xml:backend/coverage.xml

      - name: 📊 SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
